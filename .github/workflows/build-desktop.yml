name: Build Desktop Client

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q -r requirements.txt pytest ruff
      - name: Lint with ruff
        run: |
          .venv/bin/ruff check v2ray_auto/ tests/
          .venv/bin/ruff format --check v2ray_auto/ tests/
      - name: Run tests
        run: .venv/bin/python -m pytest -q

  package:
    needs: backend-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build backend binary
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PY=python
            VENVPY=.venv/Scripts/python.exe
          else
            PY=python3
            VENVPY=.venv/bin/python
          fi
          $PY -m venv .venv
          $VENVPY -m pip install -q -r requirements.txt pyinstaller
          $VENVPY -m PyInstaller \
            --onefile \
            --name v2ray-backend \
            --paths . \
            --hidden-import simple_websocket \
            --hidden-import engineio.async_drivers.threading \
            --distpath desktop/backend/dist \
            --workpath /tmp/pyi-work \
            --specpath /tmp/pyi-spec \
            desktop/backend/launcher.py

      - name: Install npm deps
        working-directory: desktop
        run: npm ci

      - name: Install frontend npm deps
        working-directory: vue_web/remote-server-config
        run: npm ci

      - name: Lint frontend
        working-directory: vue_web/remote-server-config
        run: npm run lint

      - name: Build and package
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2ray-auto-${{ matrix.target }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate release notes
        run: |
          {
            echo "## 自动生成的变更日志"
            echo ""
            gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name='${{ github.ref_name }}' \
              --jq '.body'
            echo ""
            echo "## 安装指引"
            echo ""
            sed 's/^/    /' docs/INSTALL_GUIDE.md
          } > release-notes.md
          head -c 400 release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          body_path: release-notes.md
